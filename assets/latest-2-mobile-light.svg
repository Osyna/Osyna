<svg xmlns="http://www.w3.org/2000/svg" width="320" height="300" viewBox="0 0 320 300" role="img" aria-labelledby="title"><title id="title">Screnerrr: Native Wayland screenshot annotation with on-device smart shapes 0 stars, 0 forks.</title><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><rect x="1" y="1" width="318" height="298" rx="14" fill="url(#card-surface)" stroke="#bfdac9"/><defs><linearGradient id="card-surface" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#effaf4"/><stop offset=".55" stop-color="#e2f2e8"/><stop offset="1" stop-color="#dceee3"/></linearGradient></defs><text x="22" y="42" font-size="24" fill="#087649" font-weight="650">Screnerrr</text><text x="22" y="80" font-size="16" fill="#446a55" >Created 2026-11-01</text><text x="22" y="118" font-size="22" fill="#103b27" >Native Wayland</text><text x="22" y="144" font-size="22" fill="#103b27" >screenshot annotation</text><text x="22" y="170" font-size="22" fill="#103b27" >with on-device smart</text><text x="22" y="196" font-size="22" fill="#103b27" >shapes</text><rect x="22" y="235" width="53.84" height="30" rx="5" fill="#dceee3" /><text x="31" y="256" font-size="16" fill="#103b27" >Rust</text><text x="22" y="280" font-size="16" fill="#087649" >★ 0</text><text x="105" y="280" font-size="16" fill="#446a55" >⑂ 0</text><text x="298" y="280" font-size="19" fill="#087649" text-anchor="end">↗</text></g></svg>
