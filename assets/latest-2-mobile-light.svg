<svg xmlns="http://www.w3.org/2000/svg" width="320" height="300" viewBox="0 0 320 300" role="img" aria-labelledby="title"><title id="title">Screnerrr: Native Wayland screenshot annotation with on-device smart shapes 0 stars, 0 forks.</title><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><rect x="1" y="1" width="318" height="298" rx="14" fill="#effaf4" stroke="#bfdac9"/><defs>
<clipPath id="fx-circuit-clip"><rect x="2" y="2" width="316" height="296" rx="12"/></clipPath>
<linearGradient id="fx-circuit-fade"><stop stop-color="black"/><stop offset=".45" stop-color="white" stop-opacity=".12"/><stop offset="1" stop-color="white" stop-opacity=".52"/></linearGradient>
<mask id="fx-circuit-mask"><rect width="320" height="300" fill="url(#fx-circuit-fade)"/></mask>
<radialGradient id="fx-circuit-glow" cx="1" cy=".6" r=".8"><stop stop-color="#0c8255" stop-opacity=".08"/><stop offset="1" stop-color="#0c8255" stop-opacity="0"/></radialGradient>
<style>.fx-circuit-move{animation:fx-circuit-motion 6s linear infinite}@keyframes fx-circuit-motion{from{stroke-dashoffset:0}to{stroke-dashoffset:-60}}@media(prefers-reduced-motion:reduce){.fx-circuit-move,.fx-circuit-beam,.fx-circuit-spin,.fx-circuit-bar,.fx-circuit-sweep{animation:none!important}}</style>
</defs>
<g clip-path="url(#fx-circuit-clip)"><rect width="320" height="300" fill="url(#fx-circuit-glow)"/><g mask="url(#fx-circuit-mask)"><g class="fx-circuit-move"><path d="M176.2 18h38v20h320" fill="none" stroke="#0c8255" stroke-width="1.3" stroke-dasharray="6 14"/><circle cx="214.2" cy="18" r="3" fill="#087649"/><path d="M176.2 72h47v23h320" fill="none" stroke="#0c8255" stroke-width="1.3" stroke-dasharray="6 14"/><circle cx="223.2" cy="72" r="3" fill="#087649"/><path d="M176.2 126h56v26h320" fill="none" stroke="#0c8255" stroke-width="1.3" stroke-dasharray="6 14"/><circle cx="232.2" cy="126" r="3" fill="#087649"/><path d="M176.2 180h65v29h320" fill="none" stroke="#0c8255" stroke-width="1.3" stroke-dasharray="6 14"/><circle cx="241.2" cy="180" r="3" fill="#087649"/><path d="M176.2 234h74v32h320" fill="none" stroke="#0c8255" stroke-width="1.3" stroke-dasharray="6 14"/><circle cx="250.2" cy="234" r="3" fill="#087649"/></g></g></g><rect x="22" y="22" width="4" height="24" rx="2" fill="#5de0a7" /><text x="36" y="42" font-size="24" fill="#087649" font-weight="650">Screnerrr</text><text x="22" y="80" font-size="16" fill="#446a55" >Created 2026-11-01</text><text x="22" y="118" font-size="22" fill="#103b27" >Native Wayland</text><text x="22" y="144" font-size="22" fill="#103b27" >screenshot annotation</text><text x="22" y="170" font-size="22" fill="#103b27" >with on-device smart</text><text x="22" y="196" font-size="22" fill="#103b27" >shapes</text><rect x="22" y="235" width="53.84" height="30" rx="5" fill="#dceee3" /><text x="31" y="256" font-size="16" fill="#103b27" >Rust</text><text x="22" y="280" font-size="16" fill="#087649" >★ 0</text><text x="105" y="280" font-size="16" fill="#446a55" >⑂ 0</text><text x="298" y="280" font-size="19" fill="#087649" text-anchor="end">↗</text></g></svg>
