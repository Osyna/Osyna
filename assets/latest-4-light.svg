<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="title"><title id="title">Taix: Orchestrate AI coding agents on one tmux server: desktop, terminal and phone 0 stars, 0 forks.</title><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><rect x="1" y="1" width="478" height="198" rx="14" fill="#effaf4" stroke="#bfdac9"/><defs>
<clipPath id="fx-orbit-clip"><rect x="2" y="2" width="476" height="196" rx="12"/></clipPath>
<linearGradient id="fx-orbit-fade"><stop stop-color="black"/><stop offset=".45" stop-color="white" stop-opacity=".12"/><stop offset="1" stop-color="white" stop-opacity=".52"/></linearGradient>
<mask id="fx-orbit-mask"><rect width="480" height="200" fill="url(#fx-orbit-fade)"/></mask>
<radialGradient id="fx-orbit-glow" cx="1" cy=".6" r=".8"><stop stop-color="#0c8255" stop-opacity=".08"/><stop offset="1" stop-color="#0c8255" stop-opacity="0"/></radialGradient>
<style>.fx-orbit-spin{animation:fx-orbit-orbit 16s linear infinite}@keyframes fx-orbit-orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.fx-orbit-move,.fx-orbit-beam,.fx-orbit-spin,.fx-orbit-bar,.fx-orbit-sweep{animation:none!important}}</style>
</defs>
