<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="title"><title id="title">Screnerrr: Native Wayland screenshot annotation with on-device smart shapes 0 stars, 0 forks.</title><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><rect x="1" y="1" width="478" height="198" rx="14" fill="#04180f" stroke="#1c4936"/><defs>
<clipPath id="fx-circuit-clip"><rect x="2" y="2" width="476" height="196" rx="12"/></clipPath>
<linearGradient id="fx-circuit-fade"><stop stop-color="black"/><stop offset=".45" stop-color="white" stop-opacity=".12"/><stop offset="1" stop-color="white" stop-opacity=".52"/></linearGradient>
<mask id="fx-circuit-mask"><rect width="480" height="200" fill="url(#fx-circuit-fade)"/></mask>
<radialGradient id="fx-circuit-glow" cx="1" cy=".6" r=".8"><stop stop-color="#20c784" stop-opacity=".08"/><stop offset="1" stop-color="#20c784" stop-opacity="0"/></radialGradient>
<style>.fx-circuit-move{animation:fx-circuit-motion 6s linear infinite}@keyframes fx-circuit-motion{from{stroke-dashoffset:0}to{stroke-dashoffset:-60}}@media(prefers-reduced-motion:reduce){.fx-circuit-move,.fx-circuit-beam,.fx-circuit-spin,.fx-circuit-bar,.fx-circuit-sweep{animation:none!important}}</style>
</defs>
<g clip-path="url(#fx-circuit-clip)"><rect width="480" height="200" fill="url(#fx-circuit-glow)"/><g mask="url(#fx-circuit-mask)"><g class="fx-circuit-move"><path d="M281.8 18h38v20h480" fill="none" stroke="#20c784" stroke-width="1.3" stroke-dasharray="6 14"/><circle cx="319.8" cy="18" r="3" fill="#60dfa2"/><path d="M281.8 54h47v23h480" fill="none" stroke="#20c784" stroke-width="1.3" stroke-dasharray="6 14"/><circle cx="328.8" cy="54" r="3" fill="#60dfa2"/><path d="M281.8 90h56v26h480" fill="none" stroke="#20c784" stroke-width="1.3" stroke-dasharray="6 14"/><circle cx="337.8" cy="90" r="3" fill="#60dfa2"/><path d="M281.8 126h65v29h480" fill="none" stroke="#20c784" stroke-width="1.3" stroke-dasharray="6 14"/><circle cx="346.8" cy="126" r="3" fill="#60dfa2"/><path d="M281.8 162h74v32h480" fill="none" stroke="#20c784" stroke-width="1.3" stroke-dasharray="6 14"/><circle cx="355.8" cy="162" r="3" fill="#60dfa2"/></g></g></g><rect x="22" y="22" width="4" height="24" rx="2" fill="#5de0a7" /><text x="36" y="42" font-size="25" fill="#60dfa2" font-weight="650">Screnerrr</text><text x="22" y="70" font-size="13" fill="#a1bfaf" >Created 2026-11-01</text><text x="22" y="102" font-size="16" fill="#e8fff1" >Native Wayland screenshot annotation with on-device</text><text x="22" y="125" font-size="16" fill="#e8fff1" >smart shapes</text><rect x="22" y="139" width="44.88" height="26" rx="5" fill="#103524" /><text x="31" y="156" font-size="12" fill="#e8fff1" >Rust</text><text x="22" y="180" font-size="16" fill="#60dfa2" >★ 0</text><text x="105" y="180" font-size="16" fill="#a1bfaf" >⑂ 0</text><text x="458" y="180" font-size="19" fill="#60dfa2" text-anchor="end">↗</text></g></svg>
