" class="fx-spectrum-bar" style="transform-origin:319px 284.4px;animation-delay:-1.87s"/><rect x="332" y="186.84" width="5" height="97.56" rx="2" fill="#60dfa2" class="fx-spectrum-bar" style="transform-origin:332px 284.4px;animation-delay:-2.04s"/><rect x="345" y="265.646" width="5" height="18.754" rx="2" fill="#20c784" class="fx-spectrum-bar" style="transform-origin:345px 284.4px;animation-delay:-2.21s"/></g></g></g><rect x="22" y="22" width="4" height="24" rx="2" fill="#6ee7b7" /><text x="36" y="42" font-size="24" fill="#60dfa2" font-weight="650">Macaw</text><text x="22" y="80" font-size="16" fill="#a1bfaf" >Local-first AI</text><text x="22" y="118" font-size="22" fill="#e8fff1" >Speech-to-text for Linux</text><text x="22" y="144" font-size="22" fill="#e8fff1" >and Windows. Swap</text><text x="22" y="170" font-size="22" fill="#e8fff1" >inference engines at</text><text x="22" y="196" font-size="22" fill="#e8fff1" >runtime, with GPU</text><text x="22" y="222" font-size="22" fill="#e8fff1" >acceleration and local</text><text x="22" y="248" font-size="22" fill="#e8fff1" >processing.</text><rect x="22" y="297" width="143.44" height="30" rx="5" fill="#103524" /><text x="31" y="318" font-size="16" fill="#e8fff1" >Speech-to-text</text><rect x="172.44" y="297" width="53.84" height="30" rx="5" fill="#103524" /><text x="181.44" y="318" font-size="16" fill="#e8fff1" >CUDA</text><rect x="233.28" y="297" width="71.76" height="30" rx="5" fill="#103524" /><text x="242.28" y="318" font-size="16" fill="#e8fff1" >Python</text><text x="22" y="340" font-size="16" fill="#60dfa2" >★ 1</text><text x="105" y="340" font-size="16" fill="#a1bfaf" >⑂ 0</text><text x="298" y="340" font-size="19" fill="#60dfa2" text-anchor="end">↗</text></g></svg>
