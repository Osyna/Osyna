<svg xmlns="http://www.w3.org/2000/svg" width="320" height="360" viewBox="0 0 320 360" role="img" aria-labelledby="title"><title id="title">Macaw: Speech-to-text for Linux and Windows. Swap inference engines at runtime, with GPU acceleration and local processing. 1 stars, 0 forks.</title><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><rect x="1" y="1" width="318" height="358" rx="14" fill="#04180f" stroke="#1c4936"/><defs>
<clipPath id="fx-spectrum-clip"><rect x="2" y="2" width="316" height="356" rx="12"/></clipPath>
<linearGradient id="fx-spectrum-fade"><stop stop-color="black"/><stop offset=".45" stop-color="white" stop-opacity=".12"/><stop offset="1" stop-color="white" stop-opacity=".52"/></linearGradient>
<mask id="fx-spectrum-mask"><rect width="320" height="360" fill="url(#fx-spectrum-fade)"/></mask>
<radialGradient id="fx-spectrum-glow" cx="1" cy=".6" r=".8"><stop stop-color="#20c784" stop-opacity=".08"/><stop offset="1" stop-color="#20c784" stop-opacity="0"/></radialGradient>
<style>.fx-spectrum-bar{animation:fx-spectrum-levels 2.6s ease-in-out infinite alternate}@keyframes fx-spectrum-levels{from{transform:scaleY(.4);opacity:.4}to{transform:scaleY(1);opacity:.9}}@media(prefers-reduced-motion:reduce){.fx-spectrum-move,.fx-spectrum-beam,.fx-spectrum-spin,.fx-spectrum-bar,.fx-spectrum-sweep{animation:none!important}}</style>
</defs>
