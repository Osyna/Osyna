<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="title"><title id="title">RadiAll: A radial application launcher for Wayland, written in Rust. A different way to move around your desktop. 0 stars, 0 forks.</title><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><rect x="1" y="1" width="478" height="238" rx="14" fill="#effaf4" stroke="#bfdac9"/><defs>
<clipPath id="fx-radar-clip"><rect x="2" y="2" width="476" height="236" rx="12"/></clipPath>
<linearGradient id="fx-radar-fade"><stop stop-color="black"/><stop offset=".45" stop-color="white" stop-opacity=".12"/><stop offset="1" stop-color="white" stop-opacity=".52"/></linearGradient>
<mask id="fx-radar-mask"><rect width="480" height="240" fill="url(#fx-radar-fade)"/></mask>
<radialGradient id="fx-radar-glow" cx="1" cy=".6" r=".8"><stop stop-color="#0c8255" stop-opacity=".08"/><stop offset="1" stop-color="#0c8255" stop-opacity="0"/></radialGradient>
<style>.fx-radar-sweep{animation:fx-radar-rotate 8s linear infinite}@keyframes fx-radar-rotate{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.fx-radar-move,.fx-radar-beam,.fx-radar-spin,.fx-radar-bar,.fx-radar-sweep{animation:none!important}}</style>
</defs>
<g clip-path="url(#fx-radar-clip)"><rect width="480" height="240" fill="url(#fx-radar-glow)"/><g mask="url(#fx-radar-mask)"><g class="fx-radar-move"><g transform="translate(393.6 124.8)"><g fill="none" stroke="#0c8255" stroke-width=".8"><circle r="91.2"/><circle r="58.368"/><circle r="25.536"/><path d="M-91.2 0H91.2M0 -91.2V91.2"/></g><g class="fx-radar-sweep"><path d="M0 0L0 -91.2A91.2 91.2 0 0 1 79.344 -45.6Z" fill="#087649" opacity=".45"/><path d="M0 0V-91.2" stroke="#0c8255" stroke-width="1.5"/></g></g></g></g></g><rect x="22" y="22" width="4" height="24" rx="2" fill="#2dd4bf" /><text x="36" y="42" font-size="25" fill="#087649" font-weight="650">RadiAll</text><text x="22" y="70" font-size="13" fill="#446a55" >Linux desktop</text><text x="22" y="102" font-size="16" fill="#103b27" >A radial application launcher for Wayland, written</text><text x="22" y="125" font-size="16" fill="#103b27" >in Rust. A different way to move around your</text><text x="22" y="148" font-size="16" fill="#103b27" >desktop.</text><rect x="22" y="179" width="44.88" height="26" rx="5" fill="#dceee3" /><text x="31" y="196" font-size="12" fill="#103b27" >Rust</text><rect x="73.88" y="179" width="51.6" height="26" rx="5" fill="#dceee3" /><text x="82.88" y="196" font-size="12" fill="#103b27" >Linux</text><rect x="132.48" y="179" width="65.04" height="26" rx="5" fill="#dceee3" /><text x="141.48" y="196" font-size="12" fill="#103b27" >Wayland</text><text x="22" y="220" font-size="16" fill="#087649" >★ 0</text><text x="105" y="220" font-size="16" fill="#446a55" >⑂ 0</text><text x="458" y="220" font-size="19" fill="#087649" text-anchor="end">↗</text></g></svg>
