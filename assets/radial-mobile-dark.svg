<svg xmlns="http://www.w3.org/2000/svg" width="320" height="360" viewBox="0 0 320 360" role="img" aria-labelledby="title"><title id="title">RadiAll: A radial application launcher for Wayland, written in Rust. A different way to move around your desktop. 0 stars, 0 forks.</title><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"><rect x="1" y="1" width="318" height="358" rx="14" fill="#04180f" stroke="#1c4936"/><defs>
<clipPath id="fx-radar-clip"><rect x="2" y="2" width="316" height="356" rx="12"/></clipPath>
<linearGradient id="fx-radar-fade"><stop stop-color="black"/><stop offset=".45" stop-color="white" stop-opacity=".12"/><stop offset="1" stop-color="white" stop-opacity=".52"/></linearGradient>
<mask id="fx-radar-mask"><rect width="320" height="360" fill="url(#fx-radar-fade)"/></mask>
<radialGradient id="fx-radar-glow" cx="1" cy=".6" r=".8"><stop stop-color="#20c784" stop-opacity=".08"/><stop offset="1" stop-color="#20c784" stop-opacity="0"/></radialGradient>
<style>.fx-radar-sweep{animation:fx-radar-rotate 8s linear infinite}@keyframes fx-radar-rotate{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.fx-radar-move,.fx-radar-beam,.fx-radar-spin,.fx-radar-bar,.fx-radar-sweep{animation:none!important}}</style>
</defs>
<g clip-path="url(#fx-radar-clip)"><rect width="320" height="360" fill="url(#fx-radar-glow)"/><g mask="url(#fx-radar-mask)"><g class="fx-radar-move"><g transform="translate(262.4 187.2)"><g fill="none" stroke="#20c784" stroke-width=".8"><circle r="60.8"/><circle r="38.912"/><circle r="17.024"/><path d="M-60.8 0H60.8M0 -60.8V60.8"/></g><g class="fx-radar-sweep"><path d="M0 0L0 -60.8A60.8 60.8 0 0 1 52.896 -30.4Z" fill="#60dfa2" opacity=".45"/><path d="M0 0V-60.8" stroke="#20c784" stroke-width="1.5"/></g></g></g></g></g><rect x="22" y="22" width="4" height="24" rx="2" fill="#2dd4bf" /><text x="36" y="42" font-size="24" fill="#60dfa2" font-weight="650">RadiAll</text><text x="22" y="80" font-size="16" fill="#a1bfaf" >Linux desktop</text><text x="22" y="118" font-size="22" fill="#e8fff1" >A radial application</text><text x="22" y="144" font-size="22" fill="#e8fff1" >launcher for Wayland,</text><text x="22" y="170" font-size="22" fill="#e8fff1" >written in Rust. A</text><text x="22" y="196" font-size="22" fill="#e8fff1" >different way to move</text><text x="22" y="222" font-size="22" fill="#e8fff1" >around your desktop.</text><rect x="22" y="297" width="53.84" height="30" rx="5" fill="#103524" /><text x="31" y="318" font-size="16" fill="#e8fff1" >Rust</text><rect x="82.84" y="297" width="62.800000000000004" height="30" rx="5" fill="#103524" /><text x="91.84" y="318" font-size="16" fill="#e8fff1" >Linux</text><rect x="152.64000000000001" y="297" width="80.72" height="30" rx="5" fill="#103524" /><text x="161.64000000000001" y="318" font-size="16" fill="#e8fff1" >Wayland</text><text x="22" y="340" font-size="16" fill="#60dfa2" >★ 0</text><text x="105" y="340" font-size="16" fill="#a1bfaf" >⑂ 0</text><text x="298" y="340" font-size="19" fill="#60dfa2" text-anchor="end">↗</text></g></svg>
