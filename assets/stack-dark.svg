<svg width="1000" height="372" viewBox="0 0 1000 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack">
  <style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');</style>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d0a"/>
      <stop offset="100%" stop-color="#0d120d"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="372" rx="14" fill="url(#sbg)"/>
  <rect x="0.75" y="0.75" width="998.5" height="370.5" rx="13.5" fill="none" stroke="#1d251a"/>

  <!-- title bar -->
  <circle cx="28" cy="28" r="5" fill="#1d251a"/>
  <circle cx="46" cy="28" r="5" fill="#1d251a"/>
  <circle cx="64" cy="28" r="5" fill="#1d251a"/>
  <text x="86" y="33" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#8a9782">irvin@osyna:~$ neofetch --stack<tspan fill="#ccea7a">_<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>

  <!-- mark: drawn, not typed -->
  <circle cx="172" cy="200" r="82" fill="none" stroke="#8aac69" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 9">
     <animateTransform attributeName="transform" type="rotate" from="0 172 200" to="360 172 200" dur="26s" repeatCount="indefinite"/>
   </circle>
  <circle cx="172" cy="200" r="60" fill="none" stroke="#ccea7a" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="2 7">
     <animateTransform attributeName="transform" type="rotate" from="360 172 200" to="0 172 200" dur="18s" repeatCount="indefinite"/>
   </circle>
  <circle cx="172" cy="200" r="38" fill="none" stroke="#8aac69" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="1 5">
     <animateTransform attributeName="transform" type="rotate" from="0 172 200" to="360 172 200" dur="12s" repeatCount="indefinite"/>
   </circle>
  <g><circle cx="254" cy="200" r="3" fill="#ccea7a"/>
     <animateTransform attributeName="transform" type="rotate" from="0 172 200" to="360 172 200" dur="9s" repeatCount="indefinite"/>
   </g>
  <g><circle cx="232" cy="200" r="3" fill="#8aac69"/>
     <animateTransform attributeName="transform" type="rotate" from="360 172 200" to="0 172 200" dur="6s" repeatCount="indefinite"/>
   </g>
  <polygon points="172.0,176.0 192.8,188.0 192.8,212.0 172.0,224.0 151.2,212.0 151.2,188.0" fill="none" stroke="#ccea7a" stroke-width="1.6" stroke-opacity="0.8"/>
  <circle cx="172" cy="200" r="5" fill="#ccea7a">
    <animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.45;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- readout -->
  <text x="330" y="74" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#ccea7a">irvin<tspan fill="#8a9782">@</tspan>osyna</text>
  <line x1="330" y1="86" x2="960" y2="86" stroke="#1d251a"/>

  <g font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13">
    
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.15s" fill="freeze"/>
      <text x="330" y="110" font-weight="600" fill="#8aac69">uptime</text>
      <text x="424" y="110" fill="#eef5e6">12 yrs on github · 23 repos · ★ 35</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.24s" fill="freeze"/>
      <text x="330" y="135" font-weight="600" fill="#8aac69">lang</text>
      <text x="424" y="135" fill="#eef5e6">Python · Rust · TypeScript · SQL · C# · Bash · PowerShell</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.33s" fill="freeze"/>
      <text x="330" y="160" font-weight="600" fill="#8aac69">data</text>
      <text x="424" y="160" fill="#eef5e6">ETL/ELT · Polars · Spark · Sybase IQ/ASE · PostgreSQL · MongoDB</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.42s" fill="freeze"/>
      <text x="330" y="185" font-weight="600" fill="#8aac69">ai</text>
      <text x="424" y="185" fill="#eef5e6">RAG · MCP · llama.cpp/GGUF · ONNX · CUDA/ROCm · Ollama</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.51s" fill="freeze"/>
      <text x="330" y="210" font-weight="600" fill="#8aac69">cloud</text>
      <text x="424" y="210" fill="#eef5e6">AWS EC2/VPC/S3 · Azure · Docker · GitHub Actions · Coolify</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.60s" fill="freeze"/>
      <text x="330" y="235" font-weight="600" fill="#8aac69">sec</text>
      <text x="424" y="235" fill="#eef5e6">Reverse engineering · API pentest · Vulnerability analysis</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.69s" fill="freeze"/>
      <text x="330" y="260" font-weight="600" fill="#8aac69">viz</text>
      <text x="424" y="260" fill="#eef5e6">Tableau · Power BI · SAP BO/BI · Grafana · Streamlit</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.78s" fill="freeze"/>
      <text x="330" y="285" font-weight="600" fill="#8aac69">shell</text>
      <text x="424" y="285" fill="#eef5e6">Arch Linux · Hyprland · Neovim · tmux · Docker</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.87s" fill="freeze"/>
      <text x="330" y="310" font-weight="600" fill="#8aac69">i18n</text>
      <text x="424" y="310" fill="#eef5e6">FR native · EN professional · ES limited</text>
    </g>
  </g>

  <!-- palette, the way neofetch signs off -->
  <rect x="330" y="326" width="16" height="16" rx="2" fill="#1d251a"/><rect x="352" y="326" width="16" height="16" rx="2" fill="#2f3d27"/><rect x="374" y="326" width="16" height="16" rx="2" fill="#445c2f"/><rect x="396" y="326" width="16" height="16" rx="2" fill="#6d8a4f"/><rect x="418" y="326" width="16" height="16" rx="2" fill="#8aac69"/><rect x="440" y="326" width="16" height="16" rx="2" fill="#a8ce7a"/><rect x="462" y="326" width="16" height="16" rx="2" fill="#ccea7a"/><rect x="484" y="326" width="16" height="16" rx="2" fill="#e6f5b8"/>

</svg>