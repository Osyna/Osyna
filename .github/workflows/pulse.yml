name: pulse

# Re-renders the profile hero (assets/hero-{dark,light}.svg) from live
# GitHub + npm data and commits it when it changes. No third-party
# stat-card/render service in the loop — see scripts/render.mjs.

on:
  schedule:
    - cron: "17 5 * * *" # nightly, off the hour
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/render.mjs
      - .github/workflows/pulse.yml

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: render
        run: node scripts/render.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit if changed
        run: |
          git config user.name "osyna-pulse[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore: refresh live stats"
          git push
