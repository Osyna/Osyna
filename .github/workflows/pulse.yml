name: pulse

# Refreshes the profile panels, GIF headers, and latest-projects section.

on:
  schedule:
    - cron: "17 5 * * *" # nightly, off the hour
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/**
      - package.json
      - package-lock.json
      - assets/brittany-petit-minou.jpg
      - .github/workflows/pulse.yml

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install rendering dependency
        run: npm ci

      - name: check data boundaries
        run: npm test

      - name: render
        run: node scripts/render.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit if changed
        run: |
          git config user.name "osyna-pulse[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add assets/ README.md
          git diff --cached --quiet || git commit -m "chore: refresh live stats"
          git push
